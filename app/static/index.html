<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertHub — Gerenciador de Certificados</title>
<meta name="description" content="CertHub: gerencie certificados digitais, demandas, CSRs, locais de instalação e operações em lote com fluxos Mermaid.">
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<!-- Mermaid.js for flow diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script src="/static/icons.js"></script>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon">🔐</span>
      <div>
        <div class="brand-name">CertHub</div>
        <div class="brand-sub">Certificados Digitais</div>
      </div>
    </div>
    <nav id="nav">
      <a href="#/dashboard" data-view="dashboard" title="Dashboard"><span>📊</span><span class="nav-txt">Dashboard</span></a>

      <div class="nav-group-label">Certificados</div>
      <a href="#/certs" data-view="certs" title="Certificados"><span>📜</span><span class="nav-txt">Certificados</span></a>
      <a href="#/decoder" data-view="decoder" title="Decoder"><span>🔍</span><span class="nav-txt">Decoder</span></a>
      <a href="#/validate" data-view="validate" title="Validar cadeia"><span>🔗</span><span class="nav-txt">Validar cadeia</span></a>
      <a href="#/monitor" data-view="monitor" title="Monitor de Vencimentos"><span>📡</span><span class="nav-txt">Monitor</span></a>

      <div class="nav-group-label">Ciclo de vida</div>
      <a href="#/geracao" data-view="geracao" title="Geração / Recebimento"><span>📋</span><span class="nav-txt">Geração</span></a>
      <a href="#/instalacao" data-view="instalacao" title="Instalação"><span>🔧</span><span class="nav-txt">Instalação</span></a>
      <a href="#/revogacao" data-view="revogacao" title="Revogação"><span>🚫</span><span class="nav-txt">Revogação</span></a>
      <a href="#/historico" data-view="historico" title="Histórico — buscar qualquer demanda"><span>🗄️</span><span class="nav-txt">Histórico</span></a>
      <a href="#/csr" data-view="csr" title="Gerar CSR"><span>📝</span><span class="nav-txt">Gerar CSR</span></a>
      <a href="#/kanban" data-view="kanban" title="Kanban"><span>🗂️</span><span class="nav-txt">Kanban</span></a>

      <div class="nav-group-label">Segurança</div>
      <a href="#/hsm" data-view="hsm" title="HSM (Dinamo)"><span>🔐</span><span class="nav-txt">HSM</span></a>
      <a href="#/passwords" data-view="passwords" title="Senhas"><span>🔑</span><span class="nav-txt">Senhas</span></a>

      <div class="nav-group-label">Sistema</div>
      <a href="#/users" data-view="users" title="Usuários" class="admin-only"><span>👥</span><span class="nav-txt">Usuários</span></a>
      <a href="#/auditoria" data-view="auditoria" title="Log de Auditoria"><span>🕵️</span><span class="nav-txt">Auditoria</span></a>
      <a href="#/docs" data-view="docs" title="Manuais &amp; Comandos"><span>📖</span><span class="nav-txt">Manuais</span></a>
    </nav>
    <div class="sidebar-secondary">
      <a href="#/appearance" data-view="appearance" title="Aparência"><span>🎨</span><span class="nav-txt">Aparência</span></a>
      <a href="#/settings" data-view="settings" title="Configurações"><span>⚙️</span><span class="nav-txt">Configurações</span></a>
    </div>
    <div class="sidebar-footer">
      <div id="sidebar-user" class="sidebar-user-section"></div>
      <button id="btn-logout" class="btn btn-ghost" title="Sair">🚪<span class="nav-txt"> Sair</span></button>
      <button id="menu-collapse" class="btn btn-ghost" title="Recolher/expandir menu">⇤</button>
    </div>
  </aside>
  <main id="main" class="main"></main>
</div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
  // Initialize mermaid before app.js
  if (window.mermaid) {
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        primaryColor: '#5b8afd',
        primaryTextColor: '#e6eaf2',
        primaryBorderColor: '#2b3242',
        lineColor: '#8b94a8',
        secondaryColor: '#1a1f29',
        tertiaryColor: '#222835',
        background: '#12151c',
        mainBkg: '#1a1f29',
        nodeBorder: '#2b3242',
        clusterBkg: '#222835',
        titleColor: '#e6eaf2',
        edgeLabelBackground: '#1a1f29',
        fontFamily: '"Segoe UI", system-ui, sans-serif',
      },
      flowchart: { curve: 'basis', htmlLabels: true },
    });
  }
</script>
<script src="/static/app.js"></script>
</body>
</html>
