<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <script>document.documentElement.dataset.accent = localStorage.getItem('certhub-accent') || 'blue';</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CertHub — Login</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <script src="/static/icons.js"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
        }
        .login-page {
            width: 100%;
            max-width: 380px;
            padding: 2.5rem 2rem;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .brand-header {
            margin-bottom: 2rem;
        }
        .brand-header h1 {
            margin: 0 0 0.4rem 0;
            color: var(--accent);
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        [data-accent="caixa"] .brand-header h1 svg { width: 220px; max-width: 100%; height: auto; display: block; margin: 0 auto; }
        .brand-header p {
            margin: 0;
            color: var(--text-dim);
            font-size: 0.9rem;
        }
        .login-page form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .login-page input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-sunken);
            color: var(--text);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
        }
        .login-page input:focus {
            border-color: var(--accent);
        }
        .login-page button {
            width: 100%;
            padding: 0.825rem;
            background: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }
        .login-page button:hover {
            opacity: 0.9;
        }
        #login-error {
            color: var(--red);
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
            background: var(--red-soft);
            padding: 0.6rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="brand-header">
            <h1>🔐 CertHub</h1>
            <p>Gerenciador de Certificados</p>
        </div>
        <form id="login-form">
            <input type="text" id="username" placeholder="Usuário" required autofocus>
            <input type="password" id="password" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
        <div id="login-error"></div>
    </div>

    <script>
        if (document.documentElement.dataset.accent === 'caixa') {
            document.querySelector('.brand-header h1').innerHTML = CAIXA_WORDMARK;
            document.querySelector('.brand-header p').textContent = 'CertHub — Gerenciador de Certificados';
            document.getElementById('favicon').href = CAIXA_FAVICON_HREF;
        }
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json();
                    errorDiv.textContent = data.detail || 'Erro ao fazer login';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Erro de rede';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
